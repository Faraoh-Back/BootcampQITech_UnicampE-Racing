[pytest]
testpaths = tests
markers =
    api_blackbox: API e MockServer somente por HTTP, sem SQL direto ou subprocesso.
    infrastructure_contract: SQL direto, injeção de falhas ou execução do worker.
    static_guard: inspeção estática do contrato de testes; não é teste HTTP.
    legacy: recurso sample_entity herdado, fora do produto BaaS PME.
