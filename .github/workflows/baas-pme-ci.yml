name: BaaS PME CI

on:
  push:
  pull_request:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baas-pme-api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: baas-pme-api/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.test.yml config --quiet
      - run: python -m compileall -q src
      - name: Static R1 guard
        run: python -m pytest tests -q -m static_guard --junitxml=artifacts/test-runs/static.xml
      - name: Full suite with automatic isolated infrastructure and clock boundaries
        run: python -m pytest tests -q --junitxml=artifacts/test-runs/full.xml
      - name: Preserve test reports and sanitized environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baas-pme-tests
          path: baas-pme-api/artifacts/test-runs/
