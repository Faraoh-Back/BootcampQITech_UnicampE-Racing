name: BaaS PME CI

on:
  push:
  pull_request:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    env:
      # Fixa o cenário noturno para que a S7b não dependa da hora do runner.
      NIGHT_TIME_OVERRIDE: "21:00"
    defaults:
      run:
        working-directory: baas-pme-api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: baas-pme-api/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Wait for API health check
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health_check; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: python -m compileall -q src
      - run: python -m pytest -q
      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop environment
        if: always()
        run: docker compose down -v
